<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Email Confirmation — Bandpath IELTS</title>
<style>
  :root {
    color-scheme: light;
    --bg: #F7F8FB;
    --card: #FFFFFF;
    --text-primary: #16181D;
    --text-secondary: #565D6D;
    --border: #E4E7EC;
    --brand: #0B5FFF;
    --success-bg: #E7F6EC;
    --success-fg: #1E9E4B;
    --warn-bg: #FFF4E5;
    --warn-fg: #B96A00;
    --error-bg: #FDEBEC;
    --error-fg: #D3232F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: var(--bg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text-primary);
  }
  .card {
    width: 100%;
    max-width: 420px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 40px 32px;
    text-align: center;
    box-shadow: 0 1px 3px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
  }
  .icon-circle {
    width: 64px;
    height: 64px;
    border-radius: 999px;
    margin: 0 auto 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 32px;
  }
  .icon-circle.success { background: var(--success-bg); color: var(--success-fg); }
  .icon-circle.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .icon-circle.error { background: var(--error-bg); color: var(--error-fg); }
  h1 {
    font-size: 20px;
    line-height: 1.3;
    margin: 0 0 12px;
  }
  p {
    font-size: 15px;
    line-height: 1.5;
    color: var(--text-secondary);
    margin: 0;
  }
  .brand {
    margin-top: 28px;
    font-size: 13px;
    color: var(--text-secondary);
    opacity: 0.7;
  }
  .brand strong { color: var(--brand); }
  noscript p {
    color: var(--error-fg);
  }
</style>
</head>
<body>
  <!--
    Static confirmation-landing page hosted in a public Supabase Storage
    bucket (NOT part of the mobile app bundle) — see
    services/auth.ts's EMAIL_CONFIRMATION_REDIRECT_URL and
    lib/confirmationPageState.ts, which is this file's tested source of
    truth. Keep the logic below in sync with that file if it changes.

    Why a static page instead of the app's ieltsprep://confirm deep link:
    real-device testing found Supabase does successfully verify the email,
    but tapping the link then left the user on a blank white page — most
    likely a browser failing to hand off to the app's custom URL scheme,
    which varies by browser/in-app-webview and isn't something app code can
    guarantee. This page never depends on the app being installed,
    cold-starting, or intercepting a custom scheme — it always renders.

    The confirmation itself already happened server-side by the time this
    URL is reached: Supabase's own /auth/v1/verify endpoint marks the email
    confirmed and THEN redirects here. This page only reads the query
    string Supabase appended (?code=... on success, ?error=...&
    error_code=...&error_description=... on failure) — it never calls the
    Supabase API itself.
  -->
  <main class="card" id="card">
    <div class="icon-circle" id="icon"></div>
    <h1 id="heading"></h1>
    <p id="message"></p>
  </main>
  <noscript>
    <p style="margin-top: 16px;">This page requires JavaScript. Please return to the Bandpath IELTS app and request a new confirmation email if you're not sure your email was confirmed.</p>
  </noscript>

  <script>
    (function () {
      // Mirrors lib/confirmationPageState.ts's determineConfirmationState —
      // see that file for the full reasoning and its Jest test coverage.
      function determineState(params) {
        var error = params.get('error');
        if (error) {
          var haystack = ((params.get('error_code') || '') + ' ' + (params.get('error_description') || '')).toLowerCase();
          if (haystack.indexOf('expired') !== -1) {
            return {
              status: 'expired',
              icon: '⏱',
              tone: 'warn',
              heading: 'This link has expired',
              message: 'Confirmation links expire after a while for your security. Please return to the Bandpath IELTS app and request a new confirmation email.',
            };
          }
          return {
            status: 'invalid',
            icon: '⚠',
            tone: 'warn',
            heading: 'This link is invalid or has already been used',
            message: "Please return to the Bandpath IELTS app and request a new confirmation email. If you've already confirmed your account, you can sign in directly.",
          };
        }
        if (params.get('code')) {
          return {
            status: 'success',
            icon: '✓',
            tone: 'success',
            heading: 'Email confirmed successfully',
            message: 'Your email has been verified. Please return to the Bandpath IELTS app and sign in.',
          };
        }
        return {
          status: 'error',
          icon: '!',
          tone: 'error',
          heading: 'We couldn’t confirm this link',
          message: 'Something unexpected happened loading this page. Please return to the Bandpath IELTS app and request a new confirmation email, or try again in a few minutes.',
        };
      }

      try {
        var params = new URLSearchParams(window.location.search);
        var state = determineState(params);
        document.getElementById('icon').className = 'icon-circle ' + state.tone;
        document.getElementById('icon').textContent = state.icon;
        document.getElementById('heading').textContent = state.heading;
        document.getElementById('message').textContent = state.message;
        document.title = state.heading + ' — Bandpath IELTS';
      } catch (e) {
        // Whatever went wrong parsing the URL, this must never leave the
        // page blank — fall back to the same generic guidance the
        // no-params case shows.
        document.getElementById('icon').className = 'icon-circle error';
        document.getElementById('icon').textContent = '!';
        document.getElementById('heading').textContent = 'We couldn’t confirm this link';
        document.getElementById('message').textContent = 'Something unexpected happened loading this page. Please return to the Bandpath IELTS app and request a new confirmation email, or try again in a few minutes.';
      }
    })();
  </script>

  <div class="brand">Bandpath <strong>IELTS</strong></div>
</body>
</html>
